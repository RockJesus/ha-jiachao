name: Tests

on: [push, pull_request]

jobs:
  pytest:
    name: Pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # 固定 3.11：pytest-homeassistant-custom-component 的线程泄漏检查
          # 在 Python 3.12 下会误报 _run_safe_shutdown_loop 线程（与本集成无关）
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "pytest-homeassistant-custom-component"
      - name: Run tests
        run: pytest tests/ -v
        env:
          PYTHONPATH: .
